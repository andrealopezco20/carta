<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15130f" />
  <meta name="description" content="Carta digital interactiva con animación realista de paso de página." />
  <title>Carta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="experience">
    <div class="ambient ambient--one"></div>
    <div class="ambient ambient--two"></div>

    <header class="topbar">
      <span class="eyebrow">CARTA</span>
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="Activar música suave de piano">
        <span class="sound-icon" aria-hidden="true"></span>
        <span class="sound-label">Música</span>
      </button>
    </header>

    <section class="book-stage" aria-label="Libro interactivo">
      <button class="nav-arrow nav-arrow--previous" id="previousButton" type="button" aria-label="Página anterior">
        <span aria-hidden="true">‹</span>
      </button>

      <div class="book" id="book" tabindex="0" aria-live="polite">
        <div class="book-edge" aria-hidden="true"></div>
        <div class="book-pages" id="bookPages"></div>
        <div class="book-spine" aria-hidden="true"></div>
      </div>

      <button class="nav-arrow nav-arrow--next" id="nextButton" type="button" aria-label="Página siguiente">
        <span aria-hidden="true">›</span>
      </button>
    </section>

    <footer class="book-controls">
      <button class="mobile-control" id="mobilePrevious" type="button" aria-label="Página anterior"><span>←</span> Anterior</button>
      <div class="progress" aria-label="Progreso del libro">
        <div class="progress-track"><span id="progressBar"></span></div>
      </div>
      <button class="mobile-control" id="mobileNext" type="button" aria-label="Página siguiente">Siguiente <span>→</span></button>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
